<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptStore</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d24;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3440;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            background: #141720;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }

        .upload-trigger-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-trigger-btn:hover {
            background-color: var(--accent-hover);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #12141a;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .card-prompt {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.45;
            flex-grow: 1;
            word-break: break-word;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            align-self: flex-start;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            background: #111318;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .pin-input {
            letter-spacing: 6px;
            font-size: 1.2rem !important;
            text-align: center;
            font-weight: bold;
        }

        .status-msg {
            font-size: 0.85rem;
            min-height: 20px;
        }

        .status-msg.error {
            color: var(--danger);
        }

        .submit-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>PromptStore</h1>
        <button class="upload-trigger-btn" id="openModalBtn">+ Upload Prompt</button>
    </header>

    <div class="container">
        <div id="galleryContainer" class="gallery-grid"></div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Upload New Item</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="titleInput">Title</label>
                    <input type="text" id="titleInput" placeholder="e.g., Cyberpunk Street" required>
                </div>

                <div class="form-group">
                    <label for="promptInput">Prompt Description</label>
                    <textarea id="promptInput" rows="3" placeholder="Paste full prompt text..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="imageFileInput">Image File</label>
                    <input type="file" id="imageFileInput" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="pinInput">Security PIN (4 Digits)</label>
                    <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric" required>
                </div>

                <div class="status-msg" id="statusMessage"></div>

                <button type="submit" class="submit-btn" id="submitBtn">Publish to Gallery</button>
            </form>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('galleryContainer');
        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('uploadForm');
        const statusMsg = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Modal Controls
        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            statusMsg.textContent = '';
            statusMsg.className = 'status-msg';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        // Fetch Prompts on load
        async function loadPrompts() {
            try {
                const res = await fetch('/prompts');
                if (!res.ok) throw new Error('Could not fetch items');
                const items = await res.json();

                gallery.innerHTML = '';
                if (items.length === 0) {
                    gallery.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No prompts uploaded yet.</p>';
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${item.image_url}" alt="${item.title}" loading="lazy">
                        <div class="card-body">
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-prompt">${item.prompt}</p>
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${item.prompt.replace(/'/g, "\\'")}').then(() => this.textContent = 'Copied!').catch(() => alert('Copy failed'))">Copy Prompt</button>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                gallery.innerHTML = `<p style="color: var(--danger); grid-column: 1/-1;">Failed to load prompts: ${err.message}</p>`;
            }
        }

        // Handle Upload Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pin = document.getElementById('pinInput').value.trim();
            if (pin.length !== 4) {
                statusMsg.textContent = 'PIN must be exactly 4 digits.';
                statusMsg.className = 'status-msg error';
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('titleInput').value.trim());
            formData.append('prompt', document.getElementById('promptInput').value.trim());
            formData.append('image', document.getElementById('imageFileInput').files[0]);
            formData.append('pin', pin);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            statusMsg.textContent = '';
            statusMsg.className = 'status-msg';

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Upload failed');
                }

                form.reset();
                modal.style.display = 'none';
                loadPrompts();
            } catch (err) {
                statusMsg.textContent = err.message;
                statusMsg.className = 'status-msg error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish to Gallery';
            }
        });

        document.addEventListener('DOMContentLoaded', loadPrompts);
    </script>
</body>
</html>
