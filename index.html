<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromtStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-wrap">
            <div class="brand-box">
                <span class="brand-name">PromtStore</span>
                <span class="developer-tag">Developed by Ashis Das</span>
            </div>
            <button class="btn-upload" id="openUploadBtn">+ Upload Picture</button>
        </div>
    </header>

    <main class="container">
        <!-- 1-Line Cloud Architecture Note -->
        <div class="cloud-note-strip">
            This website is live on <strong>AWS EC2</strong>, and all image assets are stored directly in <strong>Amazon S3</strong>.
        </div>

        <!-- Grid: Image + Title Only -->
        <section class="grid" id="galleryGrid"></section>
    </main>

    <!-- Detail Popup Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="detail-card">
            <button class="btn-cross" id="closeDetailBtn" title="Close">&times;</button>
            <div class="detail-img-box">
                <img id="detailImg" src="" alt="Detail Image">
            </div>
            <div class="detail-content">
                <h3 class="detail-title" id="detailTitle"></h3>
                <span class="detail-label">Generation Prompt</span>
                <div class="prompt-display" id="detailPrompt"></div>
                <button class="btn-copy" id="copyPromptBtn">Copy Prompt</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="upload-card">
            <div class="modal-header">
                <h3>Upload Image &amp; Prompt</h3>
                <button class="btn-modal-close" id="closeUploadBtn">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="imageFile">Select Image</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="imgTitle">Picture Title</label>
                    <input type="text" id="imgTitle" placeholder="e.g. Neon Cyberpunk City" required>
                </div>
                <div class="form-group">
                    <label for="imgPrompt">AI Generation Prompt</label>
                    <textarea id="imgPrompt" placeholder="Write or paste your generation prompt here..." required></textarea>
                </div>
                <!-- 4-Digit Security PIN -->
                <div class="form-group">
                    <label for="uploadPin">Security PIN (4 Digits)</label>
                    <input type="password" id="uploadPin" maxlength="4" placeholder="Enter 4-digit PIN" inputmode="numeric" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelUploadBtn">Cancel</button>
                    <button type="submit" class="btn-upload" id="submitUploadBtn">Upload to S3</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
